
name: Earn View BD APK

"on":
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract project ZIP
        run: |
          unzip -q earn-view-bd-github-ready.zip
          test -f earn-view-bd/package.json
          test -f earn-view-bd/.env.production

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        working-directory: earn-view-bd
        run: |
          npm install
          npm install @capacitor/core@6.2.1 @capacitor/cli@6.2.1 @capacitor/android@6.2.1

      - name: Configure Capacitor
        working-directory: earn-view-bd
        run: |
          printf '%s\n' '{"appId":"bd.earnview.app","appName":"Earn View BD","webDir":"dist"}' > capacitor.config.json

      - name: Build web app
        working-directory: earn-view-bd
        run: npm run build -- --base=./

      - name: Add Android
        working-directory: earn-view-bd
        run: npx cap add android

      - name: Sync Android
        working-directory: earn-view-bd
        run: npx cap sync android

      - name: Build APK
        working-directory: earn-view-bd/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Earn-View-BD-APK
          path: earn-view-bd/android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7
